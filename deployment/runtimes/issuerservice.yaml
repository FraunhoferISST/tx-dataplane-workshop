---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: issuerservice
  namespace: edc
  labels:
    app: issuerservice
    type: edc-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: issuerservice
  template:
    metadata:
      name: issuerservice
      labels:
        app: issuerservice
        platform: edc
        type: edc-app
    spec:
      containers:
        - name: issuerservice
          image: issuerservice:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
              protocol: TCP
          envFrom:
            - configMapRef: { name: issuerservice-config }
            - configMapRef:
                name: telemetry-config
          env:
            - name: OTEL_SERVICE_NAME
              value: edc.issuerservice
          livenessProbe:
            httpGet:
              path: /api/check/liveness
              port: 10010
            failureThreshold: 10
            periodSeconds: 5
            timeoutSeconds: 120
          readinessProbe:
            httpGet:
              path: /api/check/readiness
              port: 10010
            failureThreshold: 10
            periodSeconds: 5
            timeoutSeconds: 120
          startupProbe:
            httpGet:
              path: /api/check/startup
              port: 10010
            failureThreshold: 10
            periodSeconds: 5
            timeoutSeconds: 120
      restartPolicy: Always


---
apiVersion: v1
kind: Service
metadata:
  name: issuerservice
  namespace: edc
spec:
  type: ClusterIP
  selector:
    app: issuerservice
  ports:
    - port: 10010
      targetPort: 10010
      name: web
    - port: 10011
      targetPort: 10011
      name: sts
    - port: 10012
      targetPort: 10012
      name: issuance
    - port: 10013
      targetPort: 10013
      name: issueradmin
    - port: 10015
      targetPort: 10015
      name: identity
    - port: 10016
      targetPort: 10016
      name: did
    - port: 9999
      targetPort: 9999
      name: statuslist


---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: issuerservice
  namespace: edc
spec:
  parentRefs:
    - name: edc-gateway
      kind: Gateway
      sectionName: http
  hostnames:
    - issuer.localhost
  rules:
    # /issuer/admin → issuer admin API port 10013
    - matches:
        - path:
            type: PathPrefix
            value: /api/admin
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /api/admin/v1beta
      backendRefs:
        - name: issuerservice
          port: 10013
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /api/identity
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /api/identity/v1beta
      backendRefs:
        - name: issuerservice
          port: 10015
          weight: 1