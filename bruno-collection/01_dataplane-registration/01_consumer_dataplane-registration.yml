    type: json
    data: |-
      {
        "dataplaneId": "consumer-siglet",
        "endpoint": "http://consumer-siglet.edc.svc.cluster.local:8081/api/v1/consumer/dataflows",
        "transferTypes": [
          "HttpData-PULL"
        ],
        "labels": [
          "http"
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
