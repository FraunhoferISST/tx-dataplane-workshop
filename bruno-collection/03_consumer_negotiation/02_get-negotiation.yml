info:
  name: 02_get-negotiation
  type: http
  seq: 3

http:
  method: GET
  url: "{{consumer}}/api/management/v4/contractnegotiations/{{negotiation-id}}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        if (bru.hasEnvVar("CLI")) {
            await new Promise(resolve => setTimeout(resolve, 7000));
        }
    - type: after-response
      code: |-
        if(res.status >= 200 && res.status <= 299) {
            bru.setEnvVar("contract-id", res.getBody().contractAgreementId);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
