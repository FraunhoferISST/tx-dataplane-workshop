info:
  name: 08-2_verify-consumer-credentials-issued
  type: http
  seq: 13

http:
  method: GET
  url: "{{identityhub}}/api/identity/participants/consumer/credentials"
  headers:
    - name: X-Api-Key
      value: "{{provider-ih-api-key}}"

runtime:
  scripts:
    - type: before-request
      code: |-
        if (bru.hasEnvVar("CLI")) {
            await new Promise(resolve => setTimeout(resolve, 3000));
        }
    - type: tests
      code: |-
        test("3 VCs should be available", function() {
          const data = res.getBody();
          const filtered = data.filter(item => item.participantContextId === "consumer");
          expect(filtered).to.have.length(3);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
