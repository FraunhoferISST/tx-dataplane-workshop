    data: |-
      {
        "id": "deg-credential-def",
        "attestations": [
          "holder-attestation-def"
        ],
        "rules": [],
        "mappings": [
          {
            "input": "contractVersion",
            "output": "credentialSubject.contractVersion",
            "required": true
          }
        ],
        "format": "VC1_0_JWT",
