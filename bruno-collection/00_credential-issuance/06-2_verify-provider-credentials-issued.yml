info:
  name: 06-2_verify-provider-credentials-issued
  type: http
  seq: 10

http:
  method: GET
  url: "{{identityhub}}/api/identity/participants/provider/credentials"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        if (bru.hasEnvVar("CLI")) {
            await new Promise(resolve => setTimeout(resolve, 3000));
        }
    - type: tests
      code: |-
        test("3 VCs should be available", function() {
          const data = res.getBody();
          const filtered = data.filter(item => item.participantContextId === "provider");
          expect(filtered).to.have.length(3);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
