info:
  name: 02_fetch-token
  type: http
  seq: 3

http:
  method: GET
  url: "{{consumer}}/api/siglet/tokens/consumer/{{transfer-id}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if(res.status >= 200 && res.status <= 299) {
          bru.setEnvVar("dataplane-token", res.getBody().token);
          bru.setEnvVar("dataplane-endpoint", res.getBody().endpoint);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
